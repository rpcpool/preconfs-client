[package]
name = "triton-preconfs-client"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
rust-version = { workspace = true }
description = "Client for the Triton Preconfs gRPC streams"
readme = "../README.md"
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
# Accept compressed responses; see Connector::accept_compressed.
gzip = ["tonic/gzip"]
zstd = ["tonic/zstd"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
futures-core = { workspace = true }
hyper-util = { workspace = true }
smallvec = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower = { workspace = true }
triton-preconfs-proto = { workspace = true }

[dev-dependencies]
solana-hash = "4.0.0"
solana-message = { version = "4.4", features = ["wincode"] }
