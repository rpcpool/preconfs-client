[workspace]
resolver = "2"
members = ["preconfs-proto", "preconfs-client", "examples/rust"]

[workspace.package]
edition = "2024"
authors = ["Triton One"]
homepage = "https://triton.one"
repository = "https://github.com/rpcpool/preconfs-client"
license = "Apache-2.0"
keywords = ["solana", "grpc", "preconfirmations"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-core = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
protoc-bin-vendored = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-aws-lc", "tls-native-roots"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wincode = "0.6"

# Solana SDK
solana-hash = "4.0.0"
solana-message = "4.4.0"
solana-pubkey = "4.0.0"
solana-signature = "3.0.0"
solana-transaction = "4.2.0"

# Workspace crates
triton-preconfs-proto = { path = "preconfs-proto", version = "0.2.0" }
triton-preconfs-client = { path = "preconfs-client", version = "0.3.0" }

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"
collapsible_match = "allow"
